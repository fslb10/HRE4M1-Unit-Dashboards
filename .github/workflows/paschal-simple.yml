name: Paschal simple challenge checks
# Simplified four-stage classroom regression
on:
  push:
    branches: [codex/paschal-simple-20260930]
    paths:
      - 'activities/paschal-mystery/**'
      - '.github/workflows/paschal-simple.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run simplified challenge checks
        run: node activities/paschal-mystery/simple-browser.cjs
